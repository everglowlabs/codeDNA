run:
  timeout: 5m
  tests: true

linters:
  disable-all: true
  enable:
    - bodyclose
    - depguard
    - dogsled
    - dupl
    - errcheck
    - goconst
    - gocyclo
    - gosec
    - govet
    - ineffassign
    - lll
    - misspell
    - nakedret
    - revive
    - staticcheck
    - copyloopvar
    - unconvert
    - unparam
    - unused

linters-settings:
  depguard:
    rules:
      main:
        list-mode: lax # Allow everything except explicitly denied
        files:
          - "$all"
        allow:
          - $gostd
          - github.com/everglowlabs/codedna
          - github.com/spf13/cobra
          - github.com/charmbracelet
          - github.com/smacker/go-tree-sitter
          - github.com/sabhiram/go-gitignore
  dupl:
    threshold: 100
  goconst:
    min-len: 3
    min-occurrences: 3
  gocyclo:
    min-complexity: 15
  govet:
    enable:
      - shadow
  lll:
    line-length: 120
  misspell:
    locale: US
  revive:
    severity: warning

issues:
  exclude-use-default: false
  max-issues-per-linter: 0
  max-same-issues: 0
  exclude-rules:
    - path: _test\.go
      linters:
        - gosec
    - linters:
        - gosec
      text: "G304" # Potential file inclusion via variable. This is a CLI tool, it's expected.
